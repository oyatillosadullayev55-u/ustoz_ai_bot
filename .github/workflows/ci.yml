name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Reponi olish
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Paketlarni o'rnatish
        run: pip install -r requirements-dev.txt

      - name: Ruff tekshiruvi
        run: ruff check .

      - name: Ma'lumotlar qatlami testlari
        run: python tests/test_offline.py

      - name: Handler oqimlari testlari
        run: python tests/test_handlers_offline.py
